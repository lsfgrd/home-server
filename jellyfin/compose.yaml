services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "992"
    network_mode: host   # app discovery on TVs and phones
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - /srv/appdata/jellyfin/config:/config
      - /srv/appdata/jellyfin/cache:/cache
      - /srv/media/videos:/media:ro
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129   # host Intel device : inside container
    restart: unless-stopped
    labels:
      homepage.group: Mídia
      homepage.name: Jellyfin
      homepage.icon: jellyfin.png
      homepage.href: http://192.168.0.6:8096
      homepage.description: Filmes e séries
      homepage.siteMonitor: http://192.168.0.6:8096

  # Watchparty: túnel temporário (URL aleatória em trycloudflare.com).
  # Não sobe com o up.sh; use:
  #   docker compose -f jellyfin/compose.yaml --profile tunnel up -d cloudflared
  #   docker logs cloudflared 2>&1 | grep trycloudflare
  # Para encerrar:
  #   docker rm -f cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: cloudflared
    profiles: [tunnel]
    network_mode: host   # alcança o Jellyfin em localhost:8096
    command: tunnel --no-autoupdate --url http://localhost:8096
    restart: "no"
