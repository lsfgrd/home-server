services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - /srv/appdata/navidrome:/data
      - /srv/media/music:/music:ro
    restart: unless-stopped
    labels:
      homepage.group: Mídia
      homepage.name: Navidrome
      homepage.icon: navidrome.png
      homepage.href: http://192.168.0.5:4533
      homepage.description: Música
      homepage.siteMonitor: http://192.168.0.5:4533
