services:
  filebrowser:
    image: gtstef/filebrowser:2.0-stable
    container_name: filebrowser
    user: 1000:1000
    ports:
      - "8081:80"   # 8080 fica reservada para o Pi-hole
    volumes:
      - /srv/media:/hd
      - /srv/appdata/filebrowser:/home/filebrowser/data
      - ./config.yaml:/home/filebrowser/data/config.yaml
    restart: unless-stopped
    labels:
      homepage.group: Arquivos
      homepage.name: FileBrowser
      homepage.icon: filebrowser.png
      homepage.href: http://192.168.0.5:8081
      homepage.siteMonitor: http://192.168.0.5:8081
