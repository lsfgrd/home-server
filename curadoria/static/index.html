<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curadoria</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#0e1319; --panel:#151c24; --raise:#1b242e; --line:#26313d; --fg:#e7ecf1; --mut:#8795a5; --acc:#8ea7ff; --acc-ink:#0b1230; --ok:#5cc796; --warn:#e8a94a; --err:#ef6f66;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --sombra:0 8px 22px #0007; }
  @media (prefers-color-scheme: light) { :root { --bg:#eceff3; --panel:#fff; --raise:#f6f8fa; --line:#d5dbe2; --fg:#131b24; --mut:#5d6b7a; --acc:#2c4bd6; --acc-ink:#fff; --ok:#17805a; --warn:#9a5f00; --err:#bf3029; --sombra:0 8px 22px #1b2a3c33; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  header { display:flex; gap:10px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font:600 21px/1 var(--serif); letter-spacing:-.01em; margin:0 14px 0 0; }
  #aba-inbox, #aba-bib { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; padding:6px 2px; margin-right:12px; color:var(--mut); font-weight:500; }
  #aba-inbox:hover, #aba-bib:hover { color:var(--fg); }
  #aba-inbox.pri, #aba-bib.pri { color:var(--fg); border-bottom-color:var(--acc); background:none; }
  #acoes { display:flex; align-items:center; gap:10px; margin-left:auto; }
  #lshare { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mut); }

  main { flex:1; display:grid; grid-template-columns:minmax(280px,400px) 1fr; min-height:0; }
  #lista { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  #editor { overflow:auto; padding:26px 32px 40px; }
  #editor > * { max-width:980px; }

  .item { display:flex; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .item:hover { background:var(--raise); }
  .item.sel { background:var(--raise); box-shadow:inset 3px 0 var(--acc); }
  .item input[type=checkbox] { flex:none; }
  .thumb { position:relative; overflow:hidden; flex:none; width:48px; height:48px; border-radius:3px; background:var(--raise); border:1px solid var(--line); object-fit:cover; display:grid; place-items:center; font:600 18px var(--serif); color:var(--mut); }
  .thumb > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .item .t { font:600 15px/1.25 var(--serif); overflow-wrap:anywhere; }
  .item .s { color:var(--mut); font-size:12px; margin-top:1px; }
  .tag { display:inline-block; padding:0 7px; border-radius:9px; font-size:11px; border:1px solid var(--line); margin:3px 4px 0 0; }
  .tag.warn { color:var(--warn); border-color:var(--warn); } .tag.err { color:var(--err); border-color:var(--err); } .tag.ok { color:var(--ok); border-color:var(--ok); }
  input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }

  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 13px; cursor:pointer; font:inherit; transition:border-color .12s, background .12s; }
  button:hover { border-color:var(--mut); } button:disabled { opacity:.45; cursor:default; }
  button.pri { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600; }
  button.danger { color:var(--err); }
  input[type=text], input[type=number], textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:6px 9px; font:inherit; width:100%; }
  input:focus, textarea:focus { outline:none; border-color:var(--acc); }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:2px; }

  .cabeca { display:flex; gap:26px; align-items:flex-start; }
  .cabeca img, .cabeca .nocover { width:156px; height:156px; flex:none; border-radius:3px; }
  .cabeca img { object-fit:cover; background:var(--panel); box-shadow:var(--sombra); }
  .cabeca .nocover { display:grid; place-items:center; text-align:center; color:var(--mut); font-size:12px; border:1px dashed var(--line); }
  .campos { display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; margin:10px 0 18px; }
  .campos input { background:transparent; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:5px 0; }
  .campos input:focus { border-bottom-color:var(--acc); box-shadow:0 1px 0 var(--acc); }
  .campos > :has(input[data-k=album]), .campos > :has(input[data-k=mbid]) { grid-column:1 / -1; }
  .campos > :has(input[data-k=album]) { order:-1; }
  .campos input[data-k=album] { font:600 24px/1.2 var(--serif); letter-spacing:-.01em; }
  .campos input[data-k=artista] { font:500 17px/1.3 var(--serif); }
  #extras { margin:4px 0 8px; } #extras summary { cursor:pointer; color:var(--mut); padding:4px 0; }
  #extras summary:hover { color:var(--fg); }

  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th { text-align:left; font-size:12px; color:var(--mut); font-weight:500; padding:6px 4px; border-bottom:1px solid var(--line); }
  td { padding:3px; vertical-align:middle; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); font-variant-numeric:tabular-nums; }
  #extras td { border-bottom:0; }
  td input[type=text], td input[type=number] { background:transparent; border-color:transparent; padding:4px 6px; }
  td input[type=text]:hover, td input[type=number]:hover { border-color:var(--line); }
  td input[type=text]:focus, td input[type=number]:focus { background:var(--bg); border-color:var(--acc); }
  #faixas { table-layout:fixed; } #faixas th:nth-child(1), #faixas td:nth-child(1) { width:34px; } #faixas th:nth-child(2), #faixas td:nth-child(2), #faixas th:nth-child(3), #faixas td:nth-child(3) { width:64px; } #faixas th:nth-child(5), #faixas td:nth-child(5) { width:17%; } #faixas th:nth-child(6), #faixas td:nth-child(6) { width:26%; }
  td.n input { width:100%; } td.dst { font:11px ui-monospace,monospace; color:var(--mut); overflow-wrap:anywhere; }
  tr.existe td, tr.repetida td { opacity:.55; } tr.skip td { text-decoration:line-through; opacity:.4; }
  .barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0; }
  .dest { font:12px ui-monospace,monospace; padding:8px 12px; background:var(--panel); border-left:3px solid var(--acc); border-radius:0 5px 5px 0; overflow-wrap:anywhere; }
  .aviso { color:var(--warn); margin-top:6px; } .erro { color:var(--err); margin-top:6px; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; max-width:760px; width:92vw; box-shadow:var(--sombra); }
  dialog::backdrop { background:#0009; }
  .mbrow { padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin:6px 0; display:flex; gap:10px; align-items:center; }
  .mbrow span { flex:1; } .mut { color:var(--mut); }
  #toast { position:fixed; bottom:16px; right:16px; max-width:480px; background:var(--raise); border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:6px; padding:10px 14px; display:none; white-space:pre-wrap; box-shadow:var(--sombra); }
  #bresumo:empty { display:none; }
  #bib .barra { padding:10px 20px !important; margin:0; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:1; }
  #voltar { display:none; margin-bottom:12px; }

  @media (max-width:760px) {
    body { height:100dvh; font-size:15px; }
    header { flex-wrap:wrap; gap:8px; padding:10px 12px; }
    header h1 { flex:1 1 100%; font-size:20px; margin:0; }
    #acoes { position:fixed; left:0; right:0; bottom:0; z-index:5; margin:0; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; gap:8px; }
    #acoes #resumo { flex:1 1 0; order:1; font-size:13px; }
    #acoes #todos, #acoes #recarregar { order:2; min-height:34px; padding:4px 10px; font-size:13px; }
    #acoes #lshare { flex:1 1 0; order:3; font-size:13px; }
    #acoes #mover { order:4; }
    #lista, #editor, #blista { padding-bottom:120px; }
    #lista { padding-bottom:0; } #lista > :last-child { margin-bottom:120px; }
    button { min-height:40px; padding:8px 12px; }
    input[type=text], input[type=number], textarea { font-size:16px; min-height:38px; }
    input[type=checkbox] { width:22px; height:22px; }
    main { grid-template-columns:1fr; }
    #lista { border-right:0; }
    #editor { display:none; padding:14px 12px 32px; }
    body.ver-editor #lista { display:none; }
    body.ver-editor #editor { display:block; }
    #voltar { display:block; }
    .item { padding:11px 12px; }
    .cabeca { flex-direction:column; gap:14px; }
    .cabeca img, .cabeca .nocover { width:112px; height:112px; }
    .campos { gap:12px 14px; }
    .campos input[data-k=album] { font-size:21px; }
    .barra button { flex:1 1 auto; }
    .barra input[type=text] { max-width:none !important; flex:1 1 100%; }
    #bib .barra { padding:10px 12px !important; }
    #bib #blista { padding-bottom:24px; }
    #bib .barra #bfiltro { max-width:none !important; flex:1 1 100%; }
    dialog { width:96vw; max-height:90dvh; }
    #toast { left:12px; right:12px; bottom:12px; max-width:none; }
    #extras table, #extras tbody, #extras tr, #extras td { display:block; width:100% !important; }
    #faixas thead { display:none; }
    #faixas, #faixas tbody { display:block; }
    #faixas tr { display:grid; grid-template-columns:auto 1fr 1fr; gap:6px 8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
    #faixas th, #faixas td { padding:0; display:block; border:0; width:auto !important; }
    #faixas td.n input { width:100%; }
    #faixas td input[type=text], #faixas td input[type=number] { border-color:var(--line); background:var(--bg); }
    #faixas td:nth-child(4), #faixas td:nth-child(5), #faixas td.dst { grid-column:1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>Curadoria</h1>
  <button id="aba-inbox" class="pri">Inbox</button>
  <button id="aba-bib">Biblioteca</button>
  <div id="acoes">
    <span id="resumo" class="mut"></span>
    <label id="lshare" style="margin:0"><input type="checkbox" id="share-ao-mover"> Compartilhar após mover</label>
    <button id="todos">Selecionar todos</button>
    <button id="recarregar">Recarregar</button>
    <button id="mover" class="pri" disabled>Mover selecionados</button>
  </div>
</header>
<main>
  <div id="lista"></div>
  <div id="editor"><p class="mut">Escolha um álbum da lista para revisar as tags. Marque a caixa dos que quer mover.</p></div>
</main>
<section id="bib" hidden style="flex:1;min-height:0;overflow:auto">
  <div class="barra" style="padding:0 16px">
    <input type="text" id="bfiltro" placeholder="filtrar artista ou álbum" style="max-width:320px">
    <span id="bresumo" class="mut" style="margin-right:auto"></span>
    <button id="bshare" class="pri" disabled>Compartilhar</button>
    <button id="bunshare" class="danger" disabled>Parar de compartilhar</button>
  </div>
  <div id="blista"></div>
</section>
<dialog id="mb"><div id="mbconteudo"></div><div class="barra"><button id="mbfechar">Fechar</button></div></dialog>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let albuns = [], atual = null;
const marcados = new Set();           // pastas marcadas
const pular = {};                     // pasta -> Set de arquivos desmarcados

async function api(url, body) {
  const r = await fetch(url, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  if (!r.ok) throw new Error((await r.text()).replace(/<[^>]+>/g, '').trim() || r.status);
  return r.json();
}
function toast(msg, ms = 6000) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms);
}

async function carregar() {
  $('#lista').innerHTML = '<p class="mut" style="padding:12px">Lendo tags…</p>';
  albuns = await api('/api/inbox');
  for (const a of albuns) pular[a.pasta] ??= new Set();
  for (const p of [...marcados]) if (!albuns.some(a => a.pasta === p)) marcados.delete(p);
  atual = albuns.find(a => a.pasta === atual?.pasta) || null;
  desenhaLista(); desenhaEditor();
}

function badges(a) {
  const b = [];
  if (a.plano.album_existe) b.push('<span class="tag warn">álbum já existe</span>');
  const ex = a.plano.faixas.filter(f => f.estado === 'existe').length;
  if (ex) b.push(`<span class="tag warn">${ex} duplicada(s)</span>`);
  if (a.sem_tags) b.push(`<span class="tag err">${a.sem_tags} sem tags</span>`);
  if (a.plano.problemas.length) b.push('<span class="tag err">incompleto</span>');
  if (!b.length) b.push('<span class="tag ok">pronto</span>');
  return b.join('');
}

function capaUrl(a) {
  const p = encodeURIComponent(a.pasta);
  if (a.capa) return `/api/capa?pasta=${p}&arquivo=${encodeURIComponent(a.capa)}`;
  if (a.capa_embutida) return `/api/capa?pasta=${p}&embutida=${encodeURIComponent(a.capa_embutida)}`;
  return '';
}

function desenhaLista() {
  $('#lista').innerHTML = albuns.map(a => `
    <div class="item ${atual?.pasta === a.pasta ? 'sel' : ''}" data-p="${esc(a.pasta)}">
      <input type="checkbox" ${marcados.has(a.pasta) ? 'checked' : ''}>
      ${capaUrl(a) ? `<img class="thumb" loading="lazy" alt="" src="${capaUrl(a)}">`
               : `<div class="thumb">${esc((a.album || '?').charAt(0).toUpperCase())}</div>`}
      <div><div class="t">${esc(a.artista || '?')} — ${esc(a.album)}</div>
      <div class="s">${a.faixas.length} ${a.faixas.length === 1 ? 'faixa' : 'faixas'} · ${a.formatos.join('/')}${a.ano ? ' · ' + a.ano : ''}</div>
      <div>${badges(a)}</div></div>
    </div>`).join('') || '<p class="mut" style="padding:12px">Nada em downloads/soulseek.</p>';
  $('#resumo').textContent = `${albuns.length} ${albuns.length === 1 ? 'álbum' : 'álbuns'} · ${marcados.size} ${marcados.size === 1 ? 'marcado' : 'marcados'}`;
  $('#mover').disabled = !marcados.size;
}

$('#lista').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const a = albuns.find(x => x.pasta === it.dataset.p);
  if (e.target.type === 'checkbox') { e.target.checked ? marcados.add(a.pasta) : marcados.delete(a.pasta); desenhaLista(); return; }
  atual = a; desenhaLista(); desenhaEditor();
  document.body.classList.add('ver-editor'); scrollTo(0, 0);
});
$('#editor').addEventListener('click', e => {
  if (e.target.id === 'voltar') document.body.classList.remove('ver-editor');
});
$('#todos').onclick = () => {
  if (marcados.size === albuns.length) marcados.clear(); else albuns.forEach(a => marcados.add(a.pasta));
  desenhaLista();
};
$('#recarregar').onclick = () => carregar().catch(e => toast('Erro: ' + e.message));

function linhaExtra(a, k, x) {
  const mod = a.extras_mod[k], val = mod ?? (x.varia ? [] : x.valores);
  return `<tr data-k="${esc(k)}"><td style="width:160px"><b>${esc(k)}</b></td>
    <td><textarea rows="${Math.max(1, val.length)}" data-x="${esc(k)}" placeholder="${x.varia ? '(varia entre faixas — digite para sobrescrever)' : ''}"
      style="width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:inherit">${esc(val.join('\n'))}</textarea></td></tr>`;
}

function desenhaEditor() {
  const a = atual, ed = $('#editor');
  if (!a) { ed.innerHTML = '<p class="mut">Escolha um álbum da lista.</p>'; return; }
  const capa = capaUrl(a) ? `<img src="${capaUrl(a)}" alt="">`
                      : '<div class="nocover">sem capa<br>(busca no MusicBrainz)</div>';
  ed.innerHTML = `
    <button id="voltar">← Voltar à lista</button>
    <div class="cabeca">${capa}<div style="flex:1">
      <div class="mut">Origem: ${esc(a.pasta)}</div>
      <div class="campos">
        <div><label>Artista do álbum</label><input type="text" data-k="artista" value="${esc(a.artista)}"></div>
        <div><label>Álbum</label><input type="text" data-k="album" value="${esc(a.album)}"></div>
        <div><label>Ano</label><input type="text" data-k="ano" value="${esc(a.ano)}"></div>
        <div><label>MBID do release</label><input type="text" data-k="mbid" value="${esc(a.mbid)}"></div>
      </div></div></div>
    <details id="extras"><summary>Outras tags do álbum (comentário, gênero, encoder…) — valem para todas as faixas</summary>
      <table><tbody>${Object.entries(a.extras).map(([k, x]) => linhaExtra(a, k, x)).join('')}</tbody></table>
      <div class="barra"><input type="text" id="nk" list="chaves" placeholder="nova tag (ex.: genre)" style="max-width:200px">
        <input type="text" id="nv" placeholder="valor" style="max-width:300px"><button id="badd">Adicionar</button></div>
      <datalist id="chaves"><option>genre<option>comment<option>composer<option>grouping<option>label<option>albumsort<option>artistsort</datalist>
      <div class="mut">Um valor por linha. Esvaziar o campo remove a tag de todas as faixas.</div></details>
    <div class="barra"><button id="bmb">Buscar no MusicBrainz</button>
      <button id="bartfaixa">Artista → todas as faixas</button>
      <button id="bdesc" class="danger">Descartar pasta…</button></div>
    <div id="dest"></div>
    <table id="faixas"><thead><tr><th></th><th>Disco</th><th>Faixa</th><th>Título</th><th>Artista (se diferente)</th><th>Arquivo → destino</th></tr></thead>
    <tbody>${a.faixas.map((f, i) => `
      <tr data-i="${i}">
        <td><input type="checkbox" class="inc" checked title="mover esta faixa"></td>
        <td class="n"><input type="number" min="1" data-f="disco" title="Disco" value="${f.disco || 1}"></td>
        <td class="n"><input type="number" min="1" data-f="faixa" title="Faixa" value="${f.faixa ?? ''}"></td>
        <td><input type="text" data-f="titulo" value="${esc(f.titulo)}"></td>
        <td><input type="text" data-f="artista" value="${esc(f.artista)}" placeholder="artista (se diferente)"></td>
        <td class="dst"></td></tr>`).join('')}</tbody></table>
    ${a.outros.length ? `<p class="mut">Outros arquivos na pasta (descartados se a pasta ficar vazia de áudio): ${esc(a.outros.join(', '))}</p>` : ''}`;
  ed.querySelectorAll('#faixas tbody tr').forEach((tr, i) => { if (pular[a.pasta].has(a.faixas[i].arquivo)) { tr.querySelector('.inc').checked = false; tr.classList.add('skip'); } });
  if (Object.keys(a.extras_mod).length) $('#extras').open = true;
  atualizaPlano();
}

$('#editor').addEventListener('input', e => {
  const a = atual; if (!a) return;
  if (e.target.dataset.x) { a.extras_mod[e.target.dataset.x] = e.target.value.split('\n'); return; }
  if (e.target.dataset.k) a[e.target.dataset.k] = e.target.value;
  else if (e.target.dataset.f) {
    const i = +e.target.closest('tr').dataset.i, k = e.target.dataset.f;
    a.faixas[i][k] = (k === 'disco' || k === 'faixa') ? (e.target.value ? +e.target.value : null) : e.target.value;
  } else if (e.target.classList.contains('inc')) {
    const tr = e.target.closest('tr'), arq = a.faixas[+tr.dataset.i].arquivo;
    e.target.checked ? pular[a.pasta].delete(arq) : pular[a.pasta].add(arq);
    tr.classList.toggle('skip', !e.target.checked);
  }
  clearTimeout(atualizaPlano.h); atualizaPlano.h = setTimeout(atualizaPlano, 300);
});

async function atualizaPlano() {
  const a = atual; if (!a) return;
  try { a.plano = await api('/api/plano', a); } catch (e) { return; }
  if (a !== atual) return;
  const p = a.plano;
  $('#dest').innerHTML = `<div class="dest">${p.destino ? 'music/' + esc(p.destino) : '—'}</div>
    ${p.album_existe ? '<div class="aviso">Esse álbum já existe na biblioteca: faixas com o mesmo título serão puladas.</div>' : ''}
    ${p.problemas.map(x => `<div class="erro">${esc(x)}</div>`).join('')}`;
  $('#editor').querySelectorAll('#faixas tbody tr').forEach((tr, i) => {
    const s = p.faixas[i];
    tr.classList.toggle('existe', s.estado === 'existe'); tr.classList.toggle('repetida', s.estado === 'repetida');
    tr.querySelector('.dst').textContent = (s.estado === 'existe' ? '[já existe] ' : s.estado === 'repetida' ? '[repetida] ' : '') + s.destino;
  });
  desenhaLista();
}

$('#editor').addEventListener('click', async e => {
  const a = atual; if (!a) return;
  if (e.target.id === 'bartfaixa') { a.faixas.forEach(f => f.artista = a.artista); desenhaEditor(); }
  if (e.target.id === 'bmb') buscaMB();
  if (e.target.id === 'badd') {
    const k = $('#nk').value.trim().toLowerCase(), v = $('#nv').value;
    if (!/^[a-z0-9_]{1,40}$/.test(k)) return toast('Nome da tag: letras minúsculas, números e _');
    if (['title','artist','albumartist','album','date','tracknumber','discnumber','musicbrainz_albumid'].includes(k)) return toast('Essa tag tem campo próprio acima.');
    a.extras[k] ??= {valores: [], varia: false}; a.extras_mod[k] = v.split('\n');
    desenhaEditor(); $('#extras').open = true;
  }
  if (e.target.id === 'bdesc' && confirm(`Apagar "${a.pasta}" de downloads/soulseek?\nIsso não pode ser desfeito.`)) {
    await api('/api/descartar', {pasta: a.pasta}); atual = null; document.body.classList.remove('ver-editor'); await carregar();
  }
});

async function buscaMB() {
  const a = atual, dlg = $('#mb');
  $('#mbconteudo').innerHTML = '<p>Buscando…</p>'; dlg.showModal();
  try {
    const rs = await api(`/api/mb/busca?artista=${encodeURIComponent(a.artista)}&album=${encodeURIComponent(a.album)}`);
    $('#mbconteudo').innerHTML = `<h3 style="margin-top:0">Edições encontradas</h3>` +
      (rs.map(r => `<div class="mbrow"><span><b>${esc(r.artista)} — ${esc(r.titulo)}</b><br>
        <span class="mut">${r.faixas} faixas · ${esc(r.formato)} · ${esc(r.data || '?')} · ${esc(r.pais || '?')}${r.faixas === a.faixas.length ? ' · <b style="color:var(--acc)">mesmo nº de faixas</b>' : ''}</span></span>
        <button data-id="${r.id}">Usar</button></div>`).join('') || '<p class="mut">Nada encontrado. Ajuste artista/álbum e tente de novo.</p>');
  } catch (err) { $('#mbconteudo').innerHTML = `<p class="erro">${esc(err.message)}</p>`; }
}
$('#mbconteudo').addEventListener('click', async e => {
  const id = e.target.dataset.id; if (!id) return;
  const a = atual; e.target.disabled = true;
  try {
    const r = await api('/api/mb/aplicar', {id, faixas: a.faixas});
    Object.assign(a, {artista: r.artista, album: r.album, ano: r.ano, mbid: r.mbid});
    r.faixas.forEach((n, i) => { if (n) Object.assign(a.faixas[i], n); });
    $('#mb').close(); desenhaEditor();
    const sem = a.faixas.filter((_, i) => !r.faixas[i]).length;
    toast(`Tags preenchidas pelo MusicBrainz.${sem ? `\n${sem} faixa(s) sem par — revise.` : ''}${r.sem_par_mb.length ? `\n${r.sem_par_mb.length} faixa(s) do release não estão na pasta.` : ''}`);
  } catch (err) { toast('Erro: ' + err.message); e.target.disabled = false; }
});
$('#mbfechar').onclick = () => $('#mb').close();

$('#mover').onclick = async () => {
  const sel = albuns.filter(a => marcados.has(a.pasta));
  const bloq = sel.filter(a => a.plano.problemas.length);
  if (bloq.length) return toast('Corrija antes de mover:\n' + bloq.map(a => '• ' + a.pasta).join('\n'));
  const dups = sel.reduce((n, a) => n + a.plano.faixas.filter(f => f.estado === 'existe').length, 0);
  if (!confirm(`Mover ${sel.length} álbum(ns) para a biblioteca?` + (dups ? `\n${dups} faixa(s) duplicada(s) serão puladas.` : ''))) return;
  $('#mover').disabled = true;
  const payload = sel.map(a => ({...a, faixas: a.faixas.filter(f => !pular[a.pasta].has(f.arquivo))}));
  try {
    const r = await api('/api/mover', {albuns: payload, compartilhar: $('#share-ao-mover').checked});
    toast(r.resultados.map(x => x.ok
      ? `✓ ${x.destino} (${x.movidas} faixas${x.puladas.length ? `, ${x.puladas.length} puladas` : ''}${x.compartilhado ? ', compartilhado' : ''})`
      : `✗ ${x.pasta}: ${x.erro || x.erros.join('; ')}`).join('\n'), 15000);
    marcados.clear();
    await carregar();
  } catch (err) { toast('Erro: ' + err.message); $('#mover').disabled = false; }
};

// ---------- aba Biblioteca (compartilhamento Soulseek) ----------
let bib = [];
const bmarc = new Set();
const ROT = {sim: ['ok', 'compartilhado'], parcial: ['warn', 'parcial'], nao: ['', 'não compartilhado']};

function mostraAba(nome) {
  const b = nome === 'bib';
  $('#bib').hidden = !b; $('main').hidden = b;
  if (b) document.body.classList.remove('ver-editor');
  $('#acoes').hidden = b;
  history.replaceState(null, '', b ? '#biblioteca' : location.pathname);
  $('#aba-inbox').classList.toggle('pri', !b); $('#aba-bib').classList.toggle('pri', b);
  if (b) carregaBib().catch(e => toast('Erro: ' + e.message));
}
$('#aba-inbox').onclick = () => mostraAba('inbox');
$('#aba-bib').onclick = () => mostraAba('bib');

async function carregaBib() {
  bib = await api('/api/biblioteca');
  for (const r of [...bmarc]) if (!bib.some(a => a.rel === r)) bmarc.delete(r);
  desenhaBib();
}
function desenhaBib() {
  const q = $('#bfiltro').value.trim().toLowerCase();
  const vis = bib.filter(a => !q || (a.artista + ' ' + a.album).toLowerCase().includes(q));
  $('#blista').innerHTML = vis.map(a => {
    const [cls, txt] = ROT[a.share];
    return `<div class="item" data-r="${esc(a.rel)}"><input type="checkbox" ${bmarc.has(a.rel) ? 'checked' : ''}>
      <div class="thumb">${esc((a.album || '?').charAt(0).toUpperCase())}<img loading="lazy" alt="" onerror="this.remove()" src="/api/capa-bib?rel=${encodeURIComponent(a.rel)}"></div>
      <div><div class="t">${esc(a.artista)} — ${esc(a.album)}</div>
      <div class="s">${a.faixas} ${a.faixas === 1 ? 'faixa' : 'faixas'}</div><div><span class="tag ${cls}">${txt}</span></div></div></div>`;
  }).join('') || '<p class="mut" style="padding:12px">Nada encontrado.</p>';
  const n = bib.filter(a => a.share !== 'nao').length;
  $('#bresumo').textContent = `${bib.length} ${bib.length === 1 ? 'álbum' : 'álbuns'} · ${n} ${n === 1 ? 'compartilhado' : 'compartilhados'} · ${bmarc.size} ${bmarc.size === 1 ? 'marcado' : 'marcados'}`;
  $('#bshare').disabled = $('#bunshare').disabled = !bmarc.size;
}
$('#bfiltro').oninput = desenhaBib;
$('#blista').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const r = it.dataset.r;
  if (e.target.type !== 'checkbox') { bmarc.has(r) ? bmarc.delete(r) : bmarc.add(r); }
  else e.target.checked ? bmarc.add(r) : bmarc.delete(r);
  desenhaBib();
});
async function aplicaShare(ligar) {
  const sel = [...bmarc];
  if (!ligar && !confirm(`Parar de compartilhar ${sel.length} álbum(ns)?\nSó os links em shares são apagados; a biblioteca não muda.`)) return;
  try {
    const r = await api('/api/compartilhar', {albuns: sel, ligar});
    toast(`${ligar ? 'Compartilhados' : 'Removidos do compartilhamento'}: ${r.resultados.length} álbum(ns), ${r.resultados.reduce((n, x) => n + x.arquivos, 0)} arquivo(s).`);
    bmarc.clear(); await carregaBib();
  } catch (err) { toast('Erro: ' + err.message); }
}
$('#bshare').onclick = () => aplicaShare(true);
$('#bunshare').onclick = () => aplicaShare(false);

carregar().catch(e => toast('Erro: ' + e.message));
if (location.hash === '#biblioteca') mostraAba('bib');
</script>
</body>
</html>
