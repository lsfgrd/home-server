services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    ports:
      - "80:3000"
    user: 1000:989   # UID 1000, grupo docker (989) para ler o socket
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/media:/srv/media:ro   # para o widget de disco
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.6
    restart: unless-stopped
