services:
  beszel:
    image: henrygd/beszel:0.21.0
    container_name: beszel
    user: 1000:1000
    environment:
      - TZ=America/Sao_Paulo
      - APP_URL=http://192.168.0.5:8090
    volumes:
      - /srv/appdata/beszel/data:/beszel_data
    ports:
      - "8090:8090"
    restart: unless-stopped
    labels:
      homepage.group: Sistema
      homepage.name: Beszel
      homepage.icon: beszel.png
      homepage.href: http://192.168.0.5:8090
      homepage.siteMonitor: http://192.168.0.5:8090

  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: beszel-agent
    network_mode: host    # necessário para ver o tráfego real das interfaces de rede
    environment:
      - PORT=45876
      - KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFjMpvbJDZ1hRmypHbA2ov06REWJmZ0aomA4iHKyEEIR
      - EXTRA_FILESYSTEMS=sda1__Media
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/media/.beszel:/extra-filesystems/sda1:ro
    restart: unless-stopped
