services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8082        # 8080 is Pi-hole's, 8081 is FileBrowser's
      - TORRENTING_PORT=6881
    volumes:
      - /srv/appdata/qbittorrent:/config
      - /srv/media/downloads/torrents:/downloads
    ports:
      - "8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    stop_grace_period: 10s
    restart: unless-stopped
    labels:
      homepage.group: Downloads
      homepage.name: qBittorrent
      homepage.icon: qbittorrent.png
      homepage.href: http://192.168.0.5:8082
      homepage.siteMonitor: http://192.168.0.5:8082
